<p>셋 다 경쟁채널처럼 <b>글자 없는 흰 실루엣 + 은은한 그림자</b>. 고르면 PNG로 뽑아서 카드생성.py가 모든 카드 우측 상단에 자동으로 찍게 한다.</p>
<p>A = "헐" 표정 그 자체, 말풍선이라 커뮤니티 감성. B = 순간 포착(어?!)이 기호로 제일 직관적. C = 눈이라 "보다가 멈춤"을 상징, 제일 미니멀.</p>
