<!doctype html>
<html>
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>body{margin:0;}</style>
</head>
<body>
<div style="width:1080px;height:1350px;box-sizing:border-box;background:#DDEFF7;color:#0A2130;display:flex;flex-direction:column;padding:90px 80px 100px;font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif;">

  <div style="display:flex;align-items:center;gap:18px;flex-shrink:0;">
    <div style="width:18px;height:18px;background:#0E7C86;"></div>
    <div style="font-size:30px;font-weight:600;letter-spacing:0.14em;color:#4E6B7A;">혜택 정보</div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:40px;padding:56px 0;">
    <div style="display:flex;align-items:baseline;gap:24px;">
      <div style="font-size:72px;font-weight:700;color:#0E7C86;">02</div>
      <div style="font-size:52px;font-weight:700;line-height:1.25;">누가 받을 수 있나</div>
    </div>
    <div style="background:#FFFFFF;padding:40px;display:flex;flex-direction:column;gap:24px;">
      <div style="display:flex;gap:28px;align-items:baseline;">
        <div style="font-size:32px;font-weight:600;color:#4E6B7A;min-width:150px;">기본</div>
        <div style="font-size:38px;font-weight:600;line-height:1.35;">기초생활수급자<br>(생계·의료·주거·교육급여)</div>
      </div>
      <div style="height:2px;background:#BFDDE9;"></div>
      <div style="display:flex;gap:28px;align-items:baseline;">
        <div style="font-size:32px;font-weight:600;color:#4E6B7A;min-width:150px;">그리고</div>
        <div style="font-size:38px;font-weight:600;line-height:1.35;">노인·영유아·장애인·임산부<br>중증질환자·한부모 가족 등</div>

        <div style="font-size:32px;font-weight:600;color:#4E6B7A;min-width:150px;">조건</div>

      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:8px;">
      <div style="font-size:30px;font-weight:600;color:#4E6B7A;">언제까지 신청?</div>
      <div style="font-size:34px;font-weight:700;color:#0E7C86;">&#8594;</div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:500;color:#4E6B7A;flex-shrink:0;border-top:2px solid #BFDDE9;padding-top:26px;">
    <div>@계정명</div>
    <div>04 / 07</div>
