# 깃허브 예약발행 — 깃허브예약.json의 시간 지난 건을 발행하고, 발행 24시간 뒤 R2 이미지를 지운다.
# PC가 꺼져 있어도 돈다. 이미지는 저장소에 없고 Cloudflare R2에만 있다.
# 발행 창(한국시간 06:00~08:30 / 15:00~18:00)에는 15분마다, 그 외엔 매시 정각(청소·지각분 처리).
# Secrets: MAKE_WEBHOOK(웹훅 주소), R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#          R2_BUCKET, R2_PUBLIC_URL, CLOUDFLARE_ACCOUNT_ID_2
name: scheduled-publish
on:
  schedule:
    - cron: "0 * * * *"        # 매시 정각 (UTC)
    - cron: "15,30,45 21-23 * * *"  # 한국 06:15~08:45
    - cron: "15,30,45 6-8 * * *"    # 한국 15:15~17:45
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install boto3
      - name: 예약 확인·발행·R2 청소
        env:
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
        run: python 작업파일/깃허브발행.py
      - name: 결과 커밋 (발행대장·예약·삭제예약 정리)
        run: |
          git config user.name "scheduled-publish"
          git config user.email "actions@users.noreply.github.com"
          git add 깃허브예약.json 삭제예약.json 발행대장.txt 오류기록.txt
          git diff --cached --quiet || (git commit -m "깃허브 예약발행 실행" && git push)
